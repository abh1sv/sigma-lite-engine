title: Potential LSASS Memory Credential Dumping
id: 3c7e9b21-8a4f-41d2-b6e0-9f1d2c3b4a5e
status: production
description: Detects processes opening a handle to lsass.exe with suspicious memory read access masks (Sysmon Event ID 10).
author: Abhijith S V
date: 2026-11-25
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x1fffff'
  filter:
    SourceImage|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Program Files\'
  condition: selection and not filter
level: critical
falsepositives:
  - Antivirus or EDR agents scanning LSASS memory