title: Suspicious Encoded PowerShell Execution
id: 8f9c2a10-4b3e-4d1a-9f8c-1a2b3c4d5e6f
status: production
description: Detects PowerShell execution using encoded command flags while filtering out known administrative service accounts.
author: Abhijith S V
date: 2026-11-25
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4688
    NewProcessName|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -e '
  filter:
    SubjectUserName: 'admin_deploy'
  condition: selection and not filter
level: high
falsepositives:
  - Legitimate administrative deployment scripts